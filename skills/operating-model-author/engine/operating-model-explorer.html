<script id="om-sheet-format" type="application/json">"# Capture sheet format\n\nA capture sheet is one Markdown file that holds a whole operating model. It is the easy way to write a model: fixed section headings, a table for each list of things, and names instead of ids. People can read and comment on it as one document, and the engine loads it directly, just like a content folder.\n\nThis page is the full format, **format 1**. For a complete real-size sheet, see the example capture sheet. To start a new one, copy the blank template. (In the repo they are `examples/acme-capture-sheet/capture-sheet.md` and `templates/capture-sheet.md`; in the authoring skill, `references/example-capture-sheet.md` and `references/capture-sheet-template.md`.)\n\n## At a glance\n\n- The first heading is `# Operating model: \u003cname>`. That is how the engine knows the file is a capture sheet.\n- Under the title, a `Format: 1` line says which version of this format the sheet uses.\n- Each part of the model has a `##` section with a fixed heading, such as `## Roles`, `## Process: Build the proposal` or `## Structure: Partnership`.\n- Lists of things (parties, teams, roles, committees, workstreams, steps, personas, the RACI matrix, and a structure's bands, boxes and lines) are Markdown tables. Columns are found by their header, in any order, ignoring case and spaces.\n- Things refer to each other **by name**. Names match ignoring case, spaces and punctuation, so `solution  Architect` finds \"Solution architect\".\n- Different kinds of thing may share a name, such as a workstream and a process both called \"Win the work\". The exception is a role and a committee: either can be a step's owner, so a role and a committee with the same name is an error. Every id must still be unique across the whole model, so the engine appends the kind to the id of the one that comes **later** in the sheet (parties, teams, roles, committees, workstreams, personas, then processes, each in table order): the process gets the id `win-the-work-process`. There is no message, and the names stay as written. An id you set yourself (an `ID` column or `ID:` line) is never changed: if it is the same as the id of something earlier in the sheet, the report shows an error naming both places.\n- HTML comments (`\u003c!-- like this -->`) are ignored everywhere, so you can leave guidance in the sheet. A comment ends at the next `-->`. If a `\u003c!--` is never closed, everything from it to the end of the file is ignored, so close every comment you add.\n- **Open questions** and **Sources** are working notes. They are never included in an exported snapshot.\n\n## A complete small sheet\n\nEvery example on this page fits into this sheet. It names two brand packs, so it loads without errors from a folder that also holds `brands/acme/` and `brands/globex/` (see [Brand packs](#brand-packs)).\n\n```markdown\n# Operating model: Acme + Globex partnership\n\nFormat: 1\n\n## Purpose\n\nHow **Acme** and **Globex** win and deliver joint work for their clients.\n\n## Key messages\n\n- One team, one plan.\n- Acme owns the client relationship. Globex owns the solution.\n\n## About this model\n\nA short example of the capture sheet format.\n\n## Parties\n\n| Party | Summary | Brand |\n|---|---|---|\n| Acme Corp | The client-facing partner. | acme |\n| Globex | The solution partner. | globex |\n\n## Teams\n\n| Team | Party | Summary |\n|---|---|---|\n| Acme Sales | Acme Corp | Finds opportunities and runs bids. |\n\n## Roles\n\n| Role | Party | Team | Summary | People |\n|---|---|---|---|---|\n| Account lead | Acme Corp | Acme Sales | Owns the client relationship. | Sam Example |\n| Bid manager | Acme Corp | Acme Sales | Runs the bid plan. | |\n| Solution architect | Globex | | Designs the solution. | Alex Sample; Jo Placeholder |\n\n## Workstreams\n\n| Workstream | Summary | Parties | Detail |\n|---|---|---|---|\n| Presales | From the first client conversation to a submitted proposal. | Acme Corp; Globex | Detailed |\n| Delivery | Running the project once it is won. | Acme Corp; Globex | Outline |\n\n## Process: Qualify an opportunity\n\nWorkstream: Presales\nSummary: Decide quickly and together whether an opportunity is worth pursuing.\nStatus: Agreed\n\n| # | Step | Owner | Description | Outputs | Next |\n|---|---|---|---|---|---|\n| 1 | Capture the lead | Account lead | Log the opportunity as soon as the client mentions it. | Lead record | |\n| 2 | Go or no-go | Account lead | Decide together whether to bid. | | Go: 4; No go: 3 |\n| 3 | Decline politely | Account lead | Tell the client why. | | End |\n| 4 | Kick off the bid | Bid manager | Agree the bid team and the plan. | Bid plan | |\n\n### RACI\n\n| Step | Account lead | Bid manager | Solution architect |\n|---|---|---|---|\n| 1 | A | | |\n| 2 | A | I | C |\n| 3 | A | | |\n| 4 | | A | C |\n\n## Personas\n\n| Persona | Roles | Starts at | Summary |\n|---|---|---|---|\n| Acme account lead | Account lead | Process: Qualify an opportunity | You own the client. |\n\n## Open questions\n\n- [x] Does Globex join the go or no-go decision?\n\n## Sources\n\n- Workshop notes, 12 March.\n```\n\n## The top of the sheet\n\n```markdown\n# Operating model: Acme + Globex partnership\n\nFormat: 1\nID: acme-sample\nVersion: 1.0\nView: Detailed\n```\n\n| Line | Required | What it does |\n|---|---|---|\n| `# Operating model: \u003cname>` | Yes | The model's name. It must be the first heading in the file. |\n| `Format: \u003cn>` | Yes | The capture sheet format version. This page describes format 1. Without it the sheet is read as format 1, with a warning. A sheet with a newer format than the engine reads is an error: open it with a newer engine. |\n| `ID: \u003cid>` | No | The model's id, which is also the snapshot's file name. By default it comes from the name (`acme-globex-partnership`). |\n| `Version: \u003ctext>` | No | The content version, shown in the snapshot footer. |\n| `View: Simple` or `View: Detailed` | No | The home-page view. **Simple** (the default, when the line is left out) shows the model's name, then its parties, workstreams, processes and structure diagrams. **Detailed** also shows the purpose, the About this model text, the key messages and the persona doors. Only the home page changes: the Key messages button and every other page are the same in both. Viewers can't switch. Case doesn't matter; any other value is an error. |\n\n## Sections\n\n| Section | Required | Holds |\n|---|---|---|\n| `## Purpose` | Yes | Why this operating model exists: one or more paragraphs. |\n| `## Key messages` | Yes | A list (`- `) of the conclusions every viewer should reach, in order. |\n| `## About this model` | No | Text shown with the model, e.g. who it is for and how to read it. |\n| `## Parties` | Yes | A table of the organisations taking part. |\n| `## Teams` | No | A table of teams inside a party. |\n| `## Roles` | Yes | A table of the roles that do the work. |\n| `## Committees` | No | A table of groups of roles, from any parties, that own steps together. |\n| `## Workstreams` | No | A table of groups of processes. |\n| `## Process: \u003cname>` | No | One section per process: its lines, a step table, a RACI matrix and notes. |\n| `## Structure: \u003cname>` | No | One section per structure diagram: its lines, then Bands, Boxes and Lines tables and notes. |\n| `## Personas` | No | A table of the types of viewer, and where each one starts. |\n| `## Theme` | No | Your own words for terms. |\n| `## Notes: \u003cname>` | No | Text for a party, team, role, committee, workstream, process, structure or persona, shown on its page. |\n| `## Open questions` | No | A checklist of things still to decide. Not included in snapshots. |\n| `## Sources` | No | A list of the material the sheet was drafted from. Not included in snapshots. |\n\nAny other `##` heading is a warning, and its content is ignored. A missing required section is an error that names the heading to add.\n\n### Text in Purpose, About this model and Notes\n\nThese sections are ordinary Markdown: paragraphs, lists, **bold**, links and images from `assets/`. HTML is shown as plain text, never run.\n\nA heading inside one of them is written **one level below its section**, and shows as a first-level heading in the text. So under `## About this model` or `## Notes: Presales` write `### How to read it`; under `### Notes` in a process write `#### Why this matters`.\n\n## Tables\n\nEvery table has a header row, a row of dashes, then one row per item:\n\n```markdown\n## Roles\n\n| Summary | Party | Role |\n|---|---|---|\n| Owns the client relationship. | Acme Corp | Account lead |\n| Runs the bid plan. | Acme Corp | Bid manager |\n| Designs the solution. | Globex | Solution architect |\n```\n\n- Columns can be in any order, and headers ignore case and spaces (`Starts at`, `starts at` and `StartsAt` are the same).\n- Optional columns can be left out, or left empty.\n- An unknown column is a warning, and is ignored. A missing required column is an error naming the table and the column.\n- A required cell left empty is an error naming the row. Completely empty rows are skipped.\n- Lists in a cell (parties, roles, inputs, outputs, systems, KPIs) are separated by semicolons: `Acme Corp; Globex`.\n- To put a `|` inside a cell, write `\\|`.\n\nEvery table except a structure's Bands and Lines can also have these optional columns (Boxes have no `ID`):\n\n| Column | What it does |\n|---|---|\n| `Change` | How this differs from today: `New`, `Changed`, `Removed` or `Unchanged`. |\n| `Today` | How it works today, shown next to the future state. Needs `Change`. |\n| `ID` | An explicit id. By default each id comes from the name: lower case, with hyphens (`Account lead` → `account-lead`). |\n\n### Parties\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Party` | Yes | The party's name. |\n| `Summary` | No | One or two sentences about it. |\n| `Brand` | No | The id of the party's brand pack in `brands/`, e.g. `globex`. The party is then shown with that brand's colour and mark. Left empty, the party gets a neutral colour and its initials. See [Brand packs](#brand-packs). |\n\n### Teams\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Team` | Yes | The team's name. |\n| `Party` | Yes | The name of the party it belongs to. |\n| `Summary` | No | One or two sentences about it. |\n\n### Roles\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Role` | Yes | The role's name. |\n| `Party` | Yes | The name of the party it belongs to. |\n| `Team` | No | The name of its team. |\n| `Summary` | No | What this role does. |\n| `People` | No | The people who hold the role, separated by semicolons: `Sam Example; Alex Sample`. Wherever the role is shown by name, one person's name appears under it, or \"Multiple people\" for two or more; hovering over the role or focusing it lists them all, and the role's page lists them under People. Leave it empty when nobody is named. A structure box's `Name` still wins on that box. |\n\n### Committees\n\nA committee is a group of roles, usually from more than one party, that decides or does a step together, such as a bid board or a steering group. Name it as a step's `Owner`, and the step is shown \"By committee\", in a lane of its own between the parties.\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Committee` | Yes | The committee's name. It can't be the same as a role's name, because either can be a step's owner. |\n| `Members` | Yes | The member roles, separated by semicolons, each with **one** RACI letter in brackets: `A` if they share the decision, `C` if consulted, `I` if informed, `R` if they do the work. |\n| `Summary` | No | What the committee decides. |\n\n```markdown\n## Committees\n\n| Committee | Members | Summary |\n|---|---|---|\n| Bid board | Account lead (A); Solution architect (A); Bid manager (I) | Decides together whether to bid. |\n\n## Process: Decide whether to bid\n\nWorkstream: Presales\n\n| # | Step | Owner | Next |\n|---|---|---|---|\n| 1 | Go or no-go | Bid board | End |\n```\n\n- The members marked `A` are **jointly accountable**: they share the decision, and there is no single owner. So a step the committee owns has its A from the committee, and several A members are not a problem.\n- A member's letter is set here, once, not in the RACI matrix. A step the committee owns can still give letters to roles that aren't members, e.g. someone informed.\n- A member with no letter, or more than one (such as `(A/R)`), is an error naming the row and the member. So is a member that isn't a role, with a suggestion when a name is close.\n- A committee with no member marked `A`, with only one (use that role as the owner, with the others in the RACI), or whose `A` members all belong to one party (a team may fit better) is a warning. So is a committee that owns no step. None of these stops the export.\n\n### Workstreams\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Workstream` | Yes | The workstream's name. |\n| `Summary` | Yes | One or two sentences about it. |\n| `Parties` | No | The names of the parties involved, separated by semicolons. |\n| `Detail` | Yes | `Detailed` (its processes are mapped) or `Outline` (not yet). |\n\n### Personas\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Persona` | Yes | The persona's name. |\n| `Roles` | Yes | The names of the roles this persona plays, separated by semicolons. |\n| `Starts at` | Yes | Where the viewer starts: `Overview`, `Workstream: \u003cname>`, `Process: \u003cname>` or `Role: \u003cname>`. |\n| `Summary` | No | A short description, shown when viewers choose a persona. |\n\n```markdown\n## Personas\n\n| Persona | Roles | Starts at | Summary |\n|---|---|---|---|\n| Acme account lead | Account lead | Process: Qualify an opportunity | You own the client. |\n| Globex solution team | Solution architect | Workstream: Presales | You design the solution. |\n| New joiner | Account lead; Bid manager | Overview | Start with the big picture. |\n```\n\n## Processes\n\nEach process has its own section. It starts with some lines, then the step table, then optional `### RACI` and `### Notes` subsections.\n\n```markdown\n## Process: Qualify an opportunity\n\nWorkstream: Presales\nSummary: Decide quickly and together whether an opportunity is worth pursuing.\n\n| # | Step | Owner | Description | Outputs | Next |\n|---|---|---|---|---|---|\n| 1 | Capture the lead | Account lead | Log the opportunity as soon as the client mentions it. | Lead record | |\n| 2 | Go or no-go | account LEAD | Decide together whether to bid. | | Go: Kick off the bid; No go: 3 |\n| 3 | Decline politely | Account lead | Tell the client why. | | End |\n| 4 | Kick off the bid | Bid manager | Agree the bid team and the plan. | Bid plan | |\n\n### RACI\n\n| Step | Account lead | Bid manager | Solution architect |\n|---|---|---|---|\n| Capture the lead | A | | |\n| Go or no-go | A | I | C |\n| Decline politely | A | | |\n| Kick off the bid | | A | C |\n\n### Notes\n\n#### Why this matters\n\nMost lost bids were lost **before they started**.\n```\n\n| Line | Required | What it does |\n|---|---|---|\n| `Workstream: \u003cname>` | Yes | The workstream this process belongs to. |\n| `Summary: \u003ctext>` | No | One or two sentences about the process. |\n| `Status: Under review` or `Status: Agreed` | No | The review status, shown as a badge wherever the process appears. Without the line it is **Under review**, and its page says it may still change. Write `Status: Agreed` once it is settled. Case and spacing don't matter; any other value is an error. |\n| `Change:` and `Today:` | No | Current vs future state of the whole process, as in the table columns. |\n| `ID: \u003cid>` | No | An explicit id for the process. |\n\n### The step table\n\n| Column | Required | What it holds |\n|---|---|---|\n| `#` | Yes | The step's number, used by `Next` and the RACI matrix. Number the rows 1, 2, 3 and so on. |\n| `Step` | Yes | The step's name. Names must be different within a process. |\n| `Owner` | Yes | The name of the role or [committee](#committees) that owns the step. The step sits in that role's or committee's lane. |\n| `Description` | No | What happens. Markdown is allowed. |\n| `Inputs` | No | What the step needs, separated by semicolons. |\n| `Outputs` | No | What the step produces, separated by semicolons. |\n| `Systems` | No | Tools or systems used, separated by semicolons. |\n| `KPIs` | No | How the step is measured, separated by semicolons. |\n| `Next` | No | The steps that follow (see below). |\n\nSteps appear in the order of the rows.\n\n### Next\n\n- **Empty:** the flow goes on to the following row.\n- **One or more steps:** a `#` number or a step name, separated by semicolons, e.g. `4` or `Kick off the bid; 5`.\n- **Labelled branches** for a decision: `label: step`, e.g. `Go: 4; No go: 5`. Each branch becomes a labelled connector.\n- **`End`:** the flow stops at this step.\n\nA `Next` that points to a step that doesn't exist in the process is an error naming the row and the step.\n\n### The RACI matrix\n\n`### RACI` is a table with one row per step and one column per role:\n\n- The first column names the step, by `#` or by name. Its header can be anything, e.g. `Step`.\n- Every other column header is a role's name.\n- Each cell is empty or **one letter**: `R` (responsible: does the work), `A` (accountable: signs it off), `C` (consulted) or `I` (informed).\n- A cell with more than one letter, such as `A/R`, is an error. Choose R if the role does the work, or A if it signs the work off.\n- Every step should have **exactly one A**. A step with no A, or with more than one, is a warning. It doesn't stop the export.\n- A step owned by a committee takes its members' letters from the committee, so leave its row empty for them. Its A is the committee's members marked A, together. Give letters on its row only to roles that aren't members, and never A.\n- The owner counts as R when it has no letter of its own.\n- An unknown role column or step row is an error, with a suggestion when a name is close.\n\n### Notes\n\n`### Notes` is the process's text, shown on the process page. Its headings start at `####` (see [Text](#text-in-purpose-about-this-model-and-notes)).\n\n## Structures\n\nA structure is a relationship diagram you design: how the parties' teams and roles are arranged, and how they relate. Each one has its own section. The diagram has one **column per party** (from each box's role or team), and **bands**: rows you name in your own words, drawn top to bottom. A band can hold sub-bands, one level deep.\n\n```markdown\n## Structure: Partnership structure\n\nKind: Partnership\nSummary: Who leads the partnership on each side.\nMain: yes\nRelated: Sales team\nWorkstreams: Presales\n\n### Bands\n\n| Band | Inside | Opens |\n|---|---|---|\n| Leadership | | |\n| Accounts | | |\n| Harbour account | Accounts | Sales team |\n| Summit account | Accounts | |\n\n### Boxes\n\n| Band | Role | Team | Name | Note |\n|---|---|---|---|---|\n| Leadership | Account lead | | Sam Example | Grade: Director |\n| Leadership | Solution architect | | TBA | |\n| Harbour account | | Acme Sales | | |\n| Summit account | Bid manager | | Alex Sample | |\n\n### Lines\n\n| From band | From party | To band | To party | Label |\n|---|---|---|---|---|\n| Leadership | Acme Corp | Leadership | Globex | Joint steering |\n\n### Notes\n\n#### How to read it\n\nEach account has a named lead on both sides.\n\n## Structure: Sales team\n\n### Bands\n\n| Band |\n|---|\n| Team |\n\n### Boxes\n\n| Band | Role |\n|---|---|\n| Team | Bid manager |\n```\n\n| Line | Required | What it does |\n|---|---|---|\n| `Kind: \u003ctext>` | No | A label in your own words, such as Partnership, Market or Sub-programme. It has no built-in meaning. |\n| `Summary: \u003ctext>` | No | One or two sentences about the diagram. |\n| `Main: yes` | One structure | Marks the main diagram: the one that covers the whole company or partnership. When a sheet has any structures, exactly one of them has this line. |\n| `Related: \u003cnames>` | No | Related structures, separated by semicolons. A relation shows on both diagrams, so write it once. |\n| `Workstreams: \u003cnames>` | No | Related workstreams, separated by semicolons. |\n| `Status: Under review` or `Status: Agreed` | No | The review status, as for a process: Under review without the line. |\n| `Change:` and `Today:` | No | Current vs future state of the whole diagram. |\n| `ID: \u003cid>` | No | An explicit id for the structure. |\n\n**`### Bands`** (required) lists the bands in order, top to bottom:\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Band` | Yes | The band's name. Names must be different within a structure. |\n| `Inside` | No | For a sub-band, the name of the band it sits in. A band with sub-bands holds no boxes of its own, and a sub-band can't have sub-bands. |\n| `Opens` | No | The name of another structure this band opens, so viewers can drill down to it. |\n\n**`### Boxes`** (required) places roles and teams in bands, in row order:\n\n| Column | Required | What it holds |\n|---|---|---|\n| `Band` | Yes | The name of the band (or sub-band) the box sits in. |\n| `Role` or `Team` | One of them | The role or team in the box. Fill in exactly one. A team box also lists the team's roles. The same role can have boxes in several bands. |\n| `Name` | No | Who holds it, or TBA. Names are text, not elements, and search finds them. It wins over the role's `People` on this box; use it when the box's holder differs from the role's people in general (e.g. a different person per account). |\n| `Note` | No | Extra text, such as a grade or another title. |\n| `Change` and `Today` | No | Current vs future state of the box. |\n\n**`### Lines`** (optional) joins two cells. A cell is a band and a party:\n\n| Column | Required | What it holds |\n|---|---|---|\n| `From band` and `From party` | Yes | One end of the line. |\n| `To band` and `To party` | Yes | The other end. A line can't join a cell to itself. |\n| `Label` | No | Text shown with the line, e.g. Joint steering. |\n\nLines are plain: they have no arrowheads and no direction, so the same two cells in either order are the same line, and a repeated line is a warning. Lines between neighbouring cells read best.\n\n**`### Notes`** (optional) is the diagram's text, shown on its page. Its headings start at `####`.\n\n## Notes for other elements\n\n`## Notes: \u003cname>` attaches text to the party, team, role, committee, workstream, process, structure or persona with that name:\n\n```markdown\n## Notes: Presales\n\nPresales is where the partnership is **won or lost**. Both parties work from one bid plan.\n```\n\nAn unknown name is an error, with a suggestion when one is close. So is a name shared by two kinds of thing, because the engine can't tell which one the notes are for: rename one of them, or put the text in that process's `### Notes`.\n\n## Theme\n\n`## Theme` is optional. It holds `Label \u003cterm>: \u003cword>` lines, one per line: your word for one of the engine's terms: `model`, `party`, `team`, `role`, `committee`, `persona`, `workstream`, `process`, `step`, `structure` and `key message`, each also in the plural (`Label workstreams`). Rename both forms together.\n\n```markdown\n## Theme\n\nLabel workstream: Value stream\nLabel workstreams: Value streams\n```\n\nThe frame always uses the engine's neutral theme. The lines for colours, fonts, a logo and a palette are retired: `Primary colour`, `Accent colour`, `Background colour`, `Surface colour`, `Text colour`, `Palette`, `Body font`, `Heading font` and `Logo`. Each one is ignored with a warning, because party colours and marks now come from [brand packs](#brand-packs). Delete those lines, and give each party a `Brand` instead.\n\n## Brand packs\n\nA brand pack is a folder, `brands/\u003cid>/`, holding a `brand.md` (the brand's name, version, colours and mark) and the mark's image file. Packs come from your organisation's brand library: copy the whole pack folder into `brands/` next to the sheet, and never edit the copy. To take up a newer version of a brand, copy the pack again and export a new snapshot. The fields of `brand.md` are in the content reference.\n\n```text\nmy-model/\n  capture-sheet.md\n  brands/\n    acme/          brand.md, mark.svg\n    globex/        brand.md, mark.svg\n  assets/          images used in the text, if any\n```\n\n- Name each party's pack in the Parties table's `Brand` column, by the pack's id (its folder name).\n- Brand packs are read only when you load the folder (or a `.zip` of it). A sheet loaded on its own can't see `brands/`, so each brand it names is an error, with a hint to load the folder instead.\n- A brand that isn't in `brands/` is an error naming the party, with a suggestion when a pack's id is close.\n- The engine may adjust a brand colour, so that text on it is readable, parties can be told apart (also with common colour-blindness), and no party looks like a colour that has a meaning, such as \"Removed\". Each adjustment is a warning saying what changed and why. It doesn't stop the export.\n- A snapshot records which brand and version each party used. The pack's usage notes, and packs no party uses, are never included.\n\n## Open questions and Sources\n\n```markdown\n## Open questions\n\n- [ ] Who signs off the price: the account lead or the partner manager?\n- [x] Does Globex join the go or no-go decision? Yes, from March.\n\n## Sources\n\n- Partnership kick-off deck, 3 March.\n- Workshop notes, 12 March.\n```\n\n- Each unticked item (`- [ ]`) in **Open questions** is shown as a warning in author mode, quoting the question. Ticked items (`- [x]`) are ignored. Open questions don't stop the export.\n- **Sources** lists what the sheet was drafted from, so reviewers can check it.\n- Neither section, and no HTML comment, is ever included in an exported snapshot.\n\n## Validation messages\n\nEvery message about a capture sheet says where in the sheet the problem is: the section, and the row and name where there is one, e.g. `Process: Build the proposal › row 2 (Design the solution)` or `Roles › row 3 (Legal counsel)`. Then it says what's wrong and how to fix it.\n\n## Loading a sheet\n\n- Load the sheet on its own as a single `.md` file, or load a folder (or `.zip`) that holds the sheet and its `brands/` and `assets/` folders. A sheet that names brands, or shows images from `assets/`, must be loaded as a folder.\n- A folder can hold either one capture sheet or a folder of element files, not both. Mixing them is an error.\n"</script>
